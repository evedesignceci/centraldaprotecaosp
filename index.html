  <script>
    const WHATSAPP_NUMERO = "5511967399908";
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycby74SNBIq_qY5A5Nauxazi68I2LIBHI-BpgJGM0lCJIISir_8GNqawRBxnDJsmkMrdwOg/exec";

    const botState = {
      step: 0,
      data: { nome: '', telefone: '', tipo: 'Carro', modelo: '', uso: 'Particular', cidade: '' }
    };

    function mascaraTelefone(input) {
      let v = input.value.replace(/\D/g, "");
      if (v.length > 11) v = v.substring(0, 11);
      if (v.length > 10) input.value = `(${v.substring(0, 2)}) ${v.substring(2, 7)}-${v.substring(7)}`;
      else if (v.length > 6) input.value = `(${v.substring(0, 2)}) ${v.substring(2, 6)}-${v.substring(6)}`;
      else if (v.length > 2) input.value = `(${v.substring(0, 2)}) ${v.substring(2)}`;
      else input.value = v;
    }

    function addMsgBot(texto) {
      const hist = document.getElementById('chatHistorico');
      const div = document.createElement('div');
      div.className = "flex gap-2 items-end chat-bubble-bot w-full";
      div.innerHTML = `
        <div class="w-7 h-7 rounded-full bg-white shadow-sm flex items-center justify-center p-1 shrink-0 mb-1">
          <img src="https://res.cloudinary.com/oactqmgs/image/upload/v1793214951/central_d_aprote%C3%A7%C3%A3o.png" class="w-full h-full object-contain">
        </div>
        <div class="bg-white/10 text-white px-3.5 py-2.5 rounded-2xl rounded-bl-sm leading-relaxed max-w-[85%] backdrop-blur-md border border-white/5 shadow-sm">
          ${texto}
        </div>
      `;
      hist.appendChild(div);
      hist.scrollTop = hist.scrollHeight;
    }

    function addMsgUser(texto) {
      const hist = document.getElementById('chatHistorico');
      const div = document.createElement('div');
      div.className = "flex justify-end chat-bubble-user w-full mb-1";
      div.innerHTML = `
        <div class="bg-brand-gold text-black font-semibold px-4 py-2.5 rounded-2xl rounded-br-sm leading-relaxed max-w-[85%] shadow-md">
          ${texto}
        </div>
      `;
      hist.appendChild(div);
      hist.scrollTop = hist.scrollHeight;
    }

    function setAcaoBot(html) {
      document.getElementById('chatAreaAcao').innerHTML = html;
    }

    function showTypingAndRespond(msg, actionHtml, delay = 400) {
      setAcaoBot('');
      const hist = document.getElementById('chatHistorico');
      const typingId = 'typing-' + Date.now();
      
      const div = document.createElement('div');
      div.id = typingId;
      div.className = "flex gap-2 items-end chat-bubble-bot w-full";
      div.innerHTML = `
        <div class="w-7 h-7 rounded-full bg-white shadow-sm flex items-center justify-center p-1 shrink-0 mb-1">
          <img src="https://res.cloudinary.com/oactqmgs/image/upload/v1793214951/central_d_aprote%C3%A7%C3%A3o.png" class="w-full h-full object-contain">
        </div>
        <div class="bg-white/10 px-3.5 py-3 rounded-2xl rounded-bl-sm flex gap-1.5 items-center backdrop-blur-md border border-white/5">
          <span class="w-1.5 h-1.5 bg-white/70 rounded-full animate-pulse"></span>
          <span class="w-1.5 h-1.5 bg-white/70 rounded-full animate-pulse" style="animation-delay: 200ms"></span>
          <span class="w-1.5 h-1.5 bg-white/70 rounded-full animate-pulse" style="animation-delay: 400ms"></span>
        </div>
      `;
      hist.appendChild(div);
      hist.scrollTop = hist.scrollHeight;

      setTimeout(() => {
        const el = document.getElementById(typingId);
        if(el) el.remove();
        addMsgBot(msg);
        if(actionHtml) setAcaoBot(actionHtml);
      }, delay);
    }

    // Inicialização do Chat
    window.onload = () => {
      setTimeout(() => {
        showTypingAndRespond("Olá! Sou a inteligência artificial da <b>Central da Proteção</b>. 🛡️", null, 400);
        setTimeout(() => {
          showTypingAndRespond("Para iniciar sua cotação rápida, qual é o seu <b>nome</b>?", `
            <form onsubmit="botNome(event)" class="flex gap-2 w-full">
              <input type="text" id="botInputNome" placeholder="Digite seu nome..." required class="flex-1 bg-white/10 border border-white/20 rounded-full px-4 py-3 text-[13px] text-white placeholder-white/50 focus:outline-none focus:border-brand-gold backdrop-blur-md shadow-inner">
              <button type="submit" class="bg-brand-gold text-black font-bold px-5 py-3 rounded-full text-[13px] hover:bg-yellow-400 transition-colors shadow-lg">→</button>
            </form>
          `, 800);
        }, 800);
      }, 400);
    };

    function botNome(e) {
      e.preventDefault();
      const val = document.getElementById('botInputNome').value.trim();
      if (!val) return;
      botState.data.nome = val;
      const primeiroNome = val.split(' ')[0];
      addMsgUser(val);

      showTypingAndRespond(`Prazer, <b>${primeiroNome}</b>! Qual o tipo do seu veículo?`, `
        <div class="grid grid-cols-2 gap-2">
          <button onclick="botTipo('Carro')" class="py-2.5 px-3 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-[13px] font-semibold text-white transition-colors">🚗 Carro</button>
          <button onclick="botTipo('Moto')" class="py-2.5 px-3 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-[13px] font-semibold text-white transition-colors">🏍️ Moto</button>
          <button onclick="botTipo('Van / Utilitário')" class="py-2.5 px-3 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-[13px] font-semibold text-white transition-colors">🚐 Utilitário</button>
          <button onclick="botTipo('Caminhão')" class="py-2.5 px-3 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-[13px] font-semibold text-white transition-colors">🚛 Caminhão</button>
        </div>
      `, 600);
    }

    function botTipo(tipo) {
      botState.data.tipo = tipo;
      addMsgUser(tipo);

      showTypingAndRespond("Qual a <b>Marca, Modelo e Ano</b>? (Ex: Onix 1.0 2021)", `
        <form onsubmit="botModelo(event)" class="flex gap-2 w-full">
          <input type="text" id="botInputModelo" placeholder="Ex: Gol 1.6 2018" required class="flex-1 bg-white/10 border border-white/20 rounded-full px-4 py-3 text-[13px] text-white placeholder-white/50 focus:outline-none focus:border-brand-gold backdrop-blur-md shadow-inner">
          <button type="submit" class="bg-brand-gold text-black font-bold px-5 py-3 rounded-full text-[13px] hover:bg-yellow-400 transition-colors shadow-lg">→</button>
        </form>
      `, 600);
    }

    function botModelo(e) {
      e.preventDefault();
      const val = document.getElementById('botInputModelo').value.trim();
      if (!val) return;
      botState.data.modelo = val;
      addMsgUser(val);

      showTypingAndRespond("Para qual <b>finalidade</b> você usa o veículo?", `
        <div class="flex flex-col gap-2">
          <button onclick="botUso('Particular')" class="py-3 px-4 text-left bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-[13px] text-white font-medium transition-colors">🏠 Uso Particular / Lazer</button>
          <button onclick="botUso('Aplicativo (Uber/99)')" class="py-3 px-4 text-left bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-[13px] text-white font-medium transition-colors">🚗 Motorista de App (Uber/99)</button>
          <button onclick="botUso('Trabalho / Comercial')" class="py-3 px-4 text-left bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-[13px] text-white font-medium transition-colors">💼 Comercial / Empresa</button>
        </div>
      `, 600);
    }

    function botUso(uso) {
      botState.data.uso = uso;
      addMsgUser(uso);

      showTypingAndRespond("Em qual <b>cidade ou região de SP</b> você mora / pernoita?", `
        <form onsubmit="botCidade(event)" class="flex gap-2 w-full">
          <input type="text" id="botInputCidade" placeholder="Ex: Zona Leste, Guarulhos..." required class="flex-1 bg-white/10 border border-white/20 rounded-full px-4 py-3 text-[13px] text-white placeholder-white/50 focus:outline-none focus:border-brand-gold backdrop-blur-md shadow-inner">
          <button type="submit" class="bg-brand-gold text-black font-bold px-5 py-3 rounded-full text-[13px] hover:bg-yellow-400 transition-colors shadow-lg">→</button>
        </form>
      `, 600);
    }

    function botCidade(e) {
      e.preventDefault();
      const val = document.getElementById('botInputCidade').value.trim();
      if (!val) return;
      botState.data.cidade = val;
      addMsgUser(val);

      showTypingAndRespond("Quase lá! Qual o seu <b>WhatsApp</b> para enviarmos a cotação?", `
        <form onsubmit="botFinalizar(event)" class="flex gap-2 w-full">
          <input type="tel" id="botInputTel" placeholder="(11) 99999-9999" maxlength="15" oninput="mascaraTelefone(this)" required class="flex-1 bg-white/10 border border-white/20 rounded-full px-4 py-3 text-[13px] text-white placeholder-white/50 focus:outline-none focus:border-brand-gold backdrop-blur-md shadow-inner">
          <button type="submit" class="bg-brand-gold text-black font-bold px-5 py-3 rounded-full text-[13px] hover:bg-yellow-400 transition-colors shadow-lg">→</button>
        </form>
      `, 600);
    }

    function botFinalizar(e) {
      e.preventDefault();
      const val = document.getElementById('botInputTel').value.trim();
      if (!val) return;
      botState.data.telefone = val;
      addMsgUser(val);

      showTypingAndRespond("Tudo pronto! ✅ Toque abaixo para abrir o WhatsApp oficial e receber os valores.", `
        <button id="btnFinalizarRobo" onclick="acionarZapBot(this)" class="w-full bg-[#25D366] hover:bg-green-500 text-white font-bold py-3.5 px-4 rounded-[16px] flex items-center justify-center gap-2 text-[14px] shadow-xl shadow-green-500/20 transition-all active:scale-95">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.007c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.861.174.086.275.073.376-.044.102-.115.434-.506.549-.68.116-.173.232-.144.39-.086s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.099.824zm-3.423-14.416c-6.627 0-12 5.373-12 12 0 2.158.572 4.184 1.571 5.932l-1.571 5.736 5.894-1.547c1.7.94 3.655 1.479 5.734 1.479 6.627 0 12-5.373 12-12 0-6.627-5.373-12-12-12z"/></svg>
          <span>Abrir WhatsApp e Finalizar</span>
        </button>
      `, 600);
    }

    function acionarZapBot(btn) {
      btn.disabled = true;
      btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white inline-block mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Encaminhando...`;
      
      const dados = botState.data;
      const texto = 
        `Olá, equipe da *Central da Proteção Regional SP*! 👋\n\n` +
        `Recebemos um novo lead pelo *App Bio (IA)*.\n\n` +
        `👤 *NOME:* ${dados.nome}\n` +
        `📱 *WHATSAPP:* ${dados.telefone}\n` +
        `🚗 *CATEGORIA:* ${dados.tipo}\n` +
        `🚘 *VEÍCULO (Ano/Mod):* ${dados.modelo}\n` +
        `💼 *USO:* ${dados.uso}\n` +
        `📍 *REGIÃO:* ${dados.cidade}\n\n` +
        `Aguardo o retorno do consultor com os valores disponíveis!`;

      const link = `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(texto)}`;

      let redirecionado = false;
      const irParaWhatsApp = () => {
        if (!redirecionado) {
          redirecionado = true;
          window.location.href = link;
        }
      };

      setTimeout(irParaWhatsApp, 1500);

      fetch(WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          origem: 'App Bio (IA)',
          nome: dados.nome,
          telefone: dados.telefone,
          tipo: dados.tipo,
          veiculo: dados.modelo,
          uso: dados.uso,
          regiao: dados.cidade,
          data: new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" })
        })
      }).finally(() => {
        irParaWhatsApp();
      });
    }
  </script>
</body>
</html>
